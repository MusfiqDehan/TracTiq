[project]
name = "tractiq-backend"
version = "0.1.0"
description = "TracTiq EOS Level 10 Meeting & Team Management Backend"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary,pool]==3.3.9",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "pyjwt==2.15.1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "ruff==0.17.6",
  "mypy==2.4.1",
]

[project.scripts]
rules-report = "app.cli:rules_report_main"
seed-db = "app.cli:seed_db_main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
